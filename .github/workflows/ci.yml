name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The release profile is tuned for the benchmarks: fat LTO and one codegen
  # unit. That makes a CI build several times slower and changes nothing a test
  # can observe, so it is relaxed here and only here.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Release, because several tests time queries over a million rows and a
      # debug build turns seconds into minutes.
      - name: Test
        run: cargo test --release

      # Reported, not enforced. The codebase predates a clean clippy run, and a
      # step that fails on every push teaches everyone to ignore the badge --
      # which is what happened to the old `-D warnings` gate.
      - name: Clippy (advisory)
        run: cargo clippy --all-targets
        continue-on-error: true

  bench:
    name: Benchmarks build and run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The comparison against DuckDB links its shared library. It is not
      # committed -- 29 MB of someone else's binary in every clone -- so CI
      # fetches the release that matches the `duckdb` crate in Cargo.lock.
      - name: Fetch libduckdb
        run: |
          curl -sSfL -o duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.2.2/libduckdb-linux-amd64.zip
          mkdir -p lib/duckdb
          unzip -o duckdb.zip -d lib/duckdb

      # One sample per benchmark: proves every one compiles and runs end to end
      # against all four engines. Timings on shared CI runners mean nothing.
      - name: Run each benchmark once
        run: cargo bench --features rivals --bench query_bench -- --test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/lib/duckdb
